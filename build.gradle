// loader-mods: scans GitHub for Copper mods and compiles mods.json for launchers and mod browsers.
//
// Meta files are parsed with the loader's own Jval and dependency rules are checked with the loader's
// own SemanticVersionFilter, so the index can never disagree with what the loader accepts at startup.

plugins {
    id 'java'
    id 'application'
}

group = 'copper.loadermods'
version = '0.1.0'

// The loader release whose meta format and dependency rules this index targets. To move to a newer
// loader, build with `-PloaderVersion=<commit or tag>` (mavenLocal is checked before JitPack) and check
// that `./gradlew selfcheck` still passes.
ext {
    loaderVersion = findProperty('loaderVersion') ?: '810afee77f'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    // lets a locally built loader be tried before JitPack: ./gradlew selfcheck -PloaderVersion=<commit>
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // Jval (the HJSON reader the loader parses copper.mod.json with), SemanticVersion,
    // SemanticVersionFilter and StringVersionFilter - i.e. every rule this index has to agree with.
    implementation("com.github.MDTCopper.loader:core:$loaderVersion") {
        // Only the classes above are used; the mixin/ASM stack and its runtime deps stay out.
        exclude group: 'com.github.MDTCopper', module: 'Mixin'
        exclude group: 'org.ow2.asm'
        exclude group: 'com.github.google.guava'
        exclude group: 'com.google.code.gson'
    }
    // JSON output. The loader pins gson 2.8.9 at runtime scope; the index writes its own files only.
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'copper.loadermods.Main'
}

// The loader release this build targets is written into the jar so the generated index can state which
// meta format it was parsed with, without the version string being hardcoded in Java as well.
tasks.register('writeBuildInfo') {
    def outputDir = layout.buildDirectory.dir('generated/resources/loaderMods')
    def version = project.ext.loaderVersion
    outputs.dir(outputDir)
    inputs.property('loaderVersion', version)
    doLast {
        def file = outputDir.get().file('loader-mods.properties').asFile
        file.parentFile.mkdirs()
        file.text = "# generated by the writeBuildInfo task; do not edit\nloaderVersion=${version}\n"
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/resources/loaderMods'))
tasks.named('processResources') { dependsOn 'writeBuildInfo' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Xlint:-serial'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    // The updater runs from a plain `java -jar` in CI as well, so ship the one dependency inside.
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// `./gradlew run --args="update --out ."` is the real entry point; these are shorthands.
// GITHUB_TOKEN is read from the environment by the tool itself, so CI only has to export it.
tasks.register('update', JavaExec) {
    group = 'loader-mods'
    description = 'Scan GitHub and rewrite mods.json + icons/. Needs network. Extra args: -Pargs="--out ."'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    def extra = (project.findProperty('args') ?: '').toString().trim()
    args = ['update'] + (extra.isEmpty() ? [] : extra.split('\\s+') as List)
}

tasks.register('validate', JavaExec) {
    group = 'loader-mods'
    description = 'Validate a local mod directory or jar (default: ../mod-templete).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args = ['validate', (project.findProperty('target') ?: '../mod-templete').toString()]
}

// The checks live in the test source set, so they are not in the jar and not reachable from Main.
tasks.register('selfcheck', JavaExec) {
    group = 'loader-mods'
    description = 'Checks that need no network: meta parsing through the loader, rate limits, index shape.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'copper.loadermods.SelfCheck'
}
