name: Automatic Updates

on:
  schedule:
    # once a day, at 00:17 UTC. Off the hour on purpose: scheduled runs are queued at the top of the
    # hour, and GitHub delays or drops the busiest ones.
    - cron: "17 0 * * *"
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  # a scan that overruns its slot must not race the next one into mods.json
  group: loader-mods-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        # the wrapper is committed without the executable bit, exactly as the loader repo has it
        run: chmod +x gradlew

      - name: Update the index
        env:
          # the default token is enough: 5000 requests an hour instead of 60 anonymous ones
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --max-pages 10 is GitHub's ceiling: search returns at most 1000 results, 100 per page. The
          # previous index is merged in, which is how repositories that drop out of the search survive.
          ./gradlew update --no-daemon \
            -Pargs="--out . --keep-missing --max-pages 10 --threads 8"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods.json icons
          # --allow-empty keeps the schedule honest: a run with no changes still shows up in the history
          git commit --allow-empty -m "[auto-update]"
          git push
